name: Supply proxy Node runtime

on:
  pull_request:
    branches: [feature-numbers-v3]
    paths:
      - supply-api-proxy/**
      - .github/workflows/supply-proxy.yml
      - .tool-versions
      - .devcontainer/Dockerfile
      - apps/explorer/package*.json
  push:
    branches: [feature-numbers-v3]
    paths:
      - supply-api-proxy/**
      - .github/workflows/supply-proxy.yml

permissions:
  contents: read

jobs:
  proxy:
    name: Proxy tests and Node 22 image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: 版本、lockfile 安裝與語法檢查
        working-directory: supply-api-proxy
        run: |
          node --version
          npm --version
          test "$(node --version)" = v22.23.4
          npm ci --no-audit --no-fund
          node --check server.js
      - name: 供應量、認證失敗、快取與回退測試
        run: npm test --prefix supply-api-proxy
      - name: 既有 solc 在 Node 22 編譯
        working-directory: apps/explorer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const assert = require('node:assert/strict');
          const solc = require('solc');
          const result = JSON.parse(solc.compile(JSON.stringify({
            language: 'Solidity',
            sources: { 'Probe.sol': { content: 'pragma solidity ^0.8.0; contract Probe { function value() public pure returns (uint) { return 22; } }' } },
            settings: { outputSelection: { '*': { '*': ['abi', 'evm.bytecode.object'] } } }
          })));
          assert.equal((result.errors || []).filter(e => e.severity === 'error').length, 0);
          assert.ok(result.contracts['Probe.sol'].Probe.evm.bytecode.object);
          console.log(`solc ${solc.version()}: 1 compile passed, 0 errors`);
          NODE
      - name: 建置與驗證非 root 候選映像
        run: |
          image="blockscout-supply-proxy:${HEAD_SHA}"
          docker build --pull --label "org.opencontainers.image.revision=${HEAD_SHA}" -t "$image" supply-api-proxy
          test "$(docker run --rm "$image" node --version)" = v22.23.4
          test "$(docker run --rm "$image" id -u)" = 1000
          docker run --rm --mount "type=bind,source=${PWD}/supply-api-proxy/test,target=/app/test,readonly" "$image" npm test
          docker compose -f supply-api-proxy/docker-compose.yml config --format json > "$RUNNER_TEMP/proxy-compose.json"
          jq -e '.services.proxy.ports[0].host_ip == "127.0.0.1" and .services.proxy.environment.GOOGLE_APPLICATION_CREDENTIALS == "/secrets/sa.json" and .services.proxy.volumes[0].read_only' "$RUNNER_TEMP/proxy-compose.json"
          docker image inspect "$image" > "$RUNNER_TEMP/proxy-image.json"
          docker save "$image" | gzip > "$RUNNER_TEMP/supply-proxy-image.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum supply-proxy-image.tar.gz > supply-proxy-image.tar.gz.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: supply-proxy-${{ env.HEAD_SHA }}
          path: |
            ${{ runner.temp }}/supply-proxy-image.tar.gz
            ${{ runner.temp }}/supply-proxy-image.tar.gz.sha256
            ${{ runner.temp }}/proxy-image.json
            ${{ runner.temp }}/proxy-compose.json
          retention-days: 7
          if-no-files-found: error
